.ov{position:fixed;inset:0;background:linear-gradient(rgba(5,20,60,.25),rgba(5,20,60,.55));transition:background 1s;z-index:0}
body.open .ov{background:rgba(5,15,45,.62)}
.wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px))}
#envelope{cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:center;margin-top:-20vh}
.env{font-size:96px;line-height:1;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
.hint{margin-top:12px;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.card{display:none;width:100%;max-width:440px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:22px;padding:26px 22px}
.card h1{margin:0 0 14px;text-align:center;font-size:27px;color:#ffd1dc}
.line{opacity:0;transform:translateY(8px);transition:all .7s;margin:10px 0;font-size:18px;line-height:1.55}
.line.show{opacity:1;transform:none}
.btn{display:none;margin:18px auto 0;padding:12px 22px;border-radius:999px;border:0;background:#ff5c8a;color:#fff;font:inherit;font-size:17px;cursor:pointer}
#more{display:none;margin-top:18px}
ol{padding-left:22px;margin:0 0 16px}ol li{margin:8px 0;font-size:17px;line-height:1.5}
.gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.sl{flex:0 0 82%;scroll-snap-align:center;margin:0;background:rgba(255,255,255,.12);border-radius:16px;overflow:hidden}
.sl img{display:block;width:100%;height:340px;object-fit:cover}
.sl figcaption{padding:10px 12px;font-size:16px;text-align:center}
.tip{text-align:center;font-size:14px;opacity:.8;margin:6px 0 0}
.sign{text-align:right;color:#ffd1dc;font-style:italic;margin-top:18px;font-size:18px}
.fall{position:fixed;top:-40px;z-index:1;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.7}}
</style>

<script>
var msgs=["Gửi Vân Anh, vợ yêu của anh,","Cảm ơn em đã luôn ở bên, vất vả vì Bi và vì gia đình mình.","Hôm nay là ngày của em. Em hãy nghỉ ngơi và được yêu thương thật nhiều nhé.","Chúc em luôn xinh đẹp, khỏe mạnh và hạnh phúc. 🌸"];
var em=["💖","🌸","🌹","💗","🌷","✨","💐"];
function rain(n){for(var i=0;i<n;i++){(function(){var s=document.createElement("span");s.className="fall";s.textContent=em[Math.floor(Math.random()*em.length)];s.style.left=Math.random()*100+"vw";s.style.fontSize=(16+Math.random()*22)+"px";s.style.animationDuration=(4+Math.random()*5)+"s";s.style.animationDelay=(Math.random()*2)+"s";document.body.appendChild(s);setTimeout(function(){s.remove()},11000)})()}}
document.getElementById("envelope").onclick=function(){
  this.style.display="none";document.body.classList.add("open");
  var card=document.getElementById("card");card.style.display="block";
  var box=document.getElementById("lines");
  msgs.forEach(function(t,i){var d=document.createElement("div");d.className="line";d.textContent=t;box.appendChild(d);setTimeout(function(){d.classList.add("show")},400+i*1300)});
  var m=document.getElementById("more");
  setTimeout(function(){m.style.display="block"},400+msgs.length*1300);
  rain(30);
};
document.getElementById("more").onclick=function(){
  this.style.display="none";
  document.getElementById("extra").style.display="block";
  rain(45);
};
</script>
